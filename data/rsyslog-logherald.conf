# /etc/rsyslog.d/logherald.conf: hand all messages to logherald stream,
# which filters them and sends them in batches. To spare it the bulk, wrap
# the action in a filter such as
#   if $syslogseverity <= 4 then { action(...) }
# but then its include rules see only what passes that filter.
module(load="omprog")

action(type="omprog"
       name="logherald"
       binary="/usr/bin/logherald stream -C /etc/logherald/config.yaml --confirm"
       template="RSYSLOG_SyslogProtocol23Format"
       confirmMessages="on"
       signalOnClose="on"
       closeTimeout="120000"
       output="/var/log/logherald.log"
       queue.type="LinkedList"
       queue.size="10000"
       action.resumeRetryCount="-1")
